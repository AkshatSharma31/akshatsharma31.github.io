        highlights:
          - "Synthesized the giant polyoxometalate cluster {Mo₁₃₂} keplerates and {Mo₁₅₄} giant blue ring using self-assembly in aqueous medium and confirmed the formation using UV-vis spectroscopy and Raman spectroscopy."
          - "Conducted a detailed study of the polymorphism and solid-state phase transitions of acetaminophen (paracetamol)."
          - "Synthesized metastable Paracetamol Form II (orthorhombic) and characterized the phase transformation using X-Ray Diffraction."
          - "Synthesized soft-oxometalates for CO₂ reduction and water oxidation catalysis."
          - "Analyzed crystal formation as a function of the crystallization medium and temperature by systematically varying ibuprofen concentration, DMSO content, and thermal conditions."
