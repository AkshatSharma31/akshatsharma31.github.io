    experience:
      - company: Independent Research
        position: Independent Researcher
        start_date: "2026-01"
        end_date: "Present"
        location: India
        highlights:
          - >
            Investigate a possible connection between thermodynamic variance extrema and complexity maximization in a confined logarithmic-potential model motivated by Manning condensation.
          - >
            Analysed lysozyme molecular-dynamics trajectories using GROMACS, tracking backbone RMSD and Ramachandran dihedral angles.
          - >
            Developed the Quantum Assembly Index (QAI), an information-theoretic descriptor of molecular organization derived directly from quantum electron density using QTAIM.
          - >
            Developed the Core–Halo Theorem, establishing a universal organizational structure for maximally complex probability distributions within generalized statistical complexity.
          - >
            Performed density functional theory (DFT) calculations using ORCA to investigate the electronic structure and bonding of homoatomic and heteroatomic Zintl clusters.

      - company: IISER Kolkata
        position: Undergraduate Researcher
        start_date: "2023-12"
        end_date: "Present"
        location: West Bengal, India
        summary: "Supervisor: Dr. Soumyajit Roy"
        highlights:
          - >
            Synthesized the giant polyoxometalate cluster {Mo₁₃₂} keplerates and {Mo₁₅₄} giant blue ring using self-assembly in aqueous medium and confirmed the formation using UV-vis spectroscopy and Raman spectroscopy.
          - >
            Conducted a detailed study of the polymorphism and solid-state phase transitions of acetaminophen (paracetamol).
          - >
            Synthesized metastable Paracetamol Form II (orthorhombic) and characterized the phase transformation using X-Ray Diffraction.
          - >
            Synthesized soft-oxometalates for CO₂ reduction and water oxidation catalysis.
          - >
            Analyzed crystal formation as a function of the crystallization medium and temperature by systematically varying ibuprofen concentration, DMSO content, and thermal conditions.
          - >
            Trained in advanced crystallographic refinement protocols (Olex2).

      - company: IIT Ropar
        position: Research Intern
        start_date: "2025-05"
        end_date: "2025-07"
        location: Punjab, India
        summary: "Supervisor: Dr. C. M. Nagaraja"
        highlights:
          - >
            Gained foundational knowledge of Metal–Organic Frameworks (MOFs) and Covalent Organic Frameworks (COFs) through an extensive review of the scientific literature.
          - >
            Synthesized sterically demanding N-heterocyclic carbene (NHC) ligands and their organometallic complexes, confirming structural integrity via 1H NMR spectroscopy.

