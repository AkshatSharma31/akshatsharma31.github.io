        highlights:
          - "Investigate a possible connection between thermodynamic variance extrema and complexity maximization in a confined logarithmic-potential model motivated by Manning condensation."
          - "Analysed lysozyme molecular-dynamics trajectories using GROMACS, tracking backbone RMSD and Ramachandran dihedral angles."
          - "Developed the Quantum Assembly Index (QAI), an information-theoretic descriptor of molecular organization derived directly from quantum electron density using QTAIM."
          - "Developed the Core–Halo Theorem, establishing a universal organizational structure for maximally complex probability distributions within generalized statistical complexity."
          - "Performed density functional theory (DFT) calculations using ORCA to investigate the electronic structure and bonding of homoatomic and heteroatomic Zintl clusters."

